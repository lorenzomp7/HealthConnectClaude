name: Build APK

# Compila l'app Android e, sui push su main, pubblica l'APK nella release «Ultima build».
# versionCode = numero della run (GITHUB_RUN_NUMBER), quindi ogni build è più nuova della precedente.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

# Un solo build per volta: un push nuovo annulla quello vecchio ancora in corso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HealthConnectClaude.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HealthConnectClaude-apk
          path: android/HealthConnectClaude.apk

      - name: Pubblica nella release «ultima-build»
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ultima-build >/dev/null 2>&1 || \
            gh release create ultima-build --title "Ultima build" \
              --notes "APK aggiornato automaticamente a ogni push su main. Firmato con android/app/debug.keystore, quindi si installa come aggiornamento delle build precedenti." || true
          gh release upload ultima-build HealthConnectClaude.apk --clobber
